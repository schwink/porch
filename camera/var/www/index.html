<html>

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Porch</title>
  <style>
    body {
      background-color: lightgray;
      margin: 0px;
      padding: 0px;
    }

    div#root {
      margin: 0px;
      padding: 0px;
    }

    div.live_video {
      background-color: white;
      width: fit-content;
      padding: 0;
      margin: 4px;
      border-radius: 8px;
      border: 1px solid darkgray;
    }

    div.live_video p {
      padding: 4px;
      margin: 0;
    }

    div.live_video iframe {
      padding: 0;
      margin: 0;
      border-radius: 8px;
      border: 0;
    }

    ul.frame_list {
      list-style-type: none;
      width: fit-content;
      padding: 0;
      margin: 0;
    }

    li.frame {
      background-color: white;
      padding: 0;
      margin: 4px;
      display: flex;
      flex-direction: row;
      border-radius: 8px;
      border: 1px solid darkgray;
    }

    li.frame img {
      max-width: 80vw;
      border-radius: 8px;
      border-right: 1px solid darkgray;
    }

    li.frame div {
      width: fit-content;
      margin: 16px;
      font-size: 1.2em;
    }

    li.frame table {
      width: auto;
    }

    table {
      border-collapse: collapse;
      margin-bottom: 1em;
    }

    td {
      padding: 8px 12px;
      border: 1px solid #dfe2e5;
      text-align: left;
    }

    tr:nth-child(even) {
      background-color: #fcfcfc;
    }

    tr:hover {
      background-color: #f0f0f0;
    }
  </style>
</head>

<body>
  <div id="root">
    Loading...
    <noscript>JavaScript is required.</noscript>
  </div>

  <script type="module">
    import React from "https://unpkg.com/es-react@latest/dev/react.js";
    import ReactDOM from "https://unpkg.com/es-react@latest/dev/react-dom.js";
    import PropTypes from "https://unpkg.com/es-react@latest/dev/prop-types.js";
    import htm from "https://unpkg.com/htm@latest?module";
    const html = htm.bind(React.createElement);

    const FrameListItem = ({ frame } = props) => {
      return html`<li className="frame">
        <img src="frames/${frame.name}"></img>
        <div>
          <table>
            <tbody>
            <tr><td>Time:</td><td>${new Date(frame.timestamp).toLocaleString()}</td></tr>
            <tr><td>Perceptual Hash:</td><td><code>${frame.p_hash}</code></td></tr>
            <tr><td>Perceptual Hash Distance:</td><td><code>${frame.p_hash_distance}</code></td></tr>
            </tbody>
          </table>
        </div>
      </li>`;
    };
    FrameListItem.propTypes = {
      frame: PropTypes.object.isRequired,
    };

    const FrameList = ({ scrollContainerRef } = props) => {
      const [frames, setFrames] = React.useState([]);

      const [isLoading, setIsLoading] = React.useState(true);
      const [isFetching, setIsFetching] = React.useState(false);
      const frameStreamEventSourceRef = React.useRef(null);
      const [frameStreamRetryCounter, setFrameStreamRetryCounter] = React.useState(0);
      const [startCursor, setStartCursor] = React.useState(null);
      const [endCursor, setEndCursor] = React.useState(null);
      const [hasPreviousPage, setHasPreviousPage] = React.useState(true);
      const [error, setError] = React.useState(false);

      const fetchData = async () => {
        if (!hasPreviousPage) {
          return;
        }

        if (isFetching) {
          return;
        }
        setIsFetching(true);

        try {
          const response = await fetch(`api/frames?last=10&before=${startCursor}`);
          if (!response.ok) {
            throw new Error(`HTTP error! status: ${response.status}`);
          }
          const result = await response.json();

          setFrames(frames => {
            const newFrames = [...frames, ...result.nodes];
            newFrames.sort((a, b) => b.timestamp - a.timestamp);
            const unique = newFrames.filter((x, i, a) => !i || x.name != a[i - 1].name)
            return unique;
          });

          setStartCursor(result.startCursor);
          if (endCursor === null) {
            // First page received
            setEndCursor(result.endCursor);
          }
          setHasPreviousPage(result.hasPreviousPage);
        } catch (error) {
          setError(error);
        } finally {
          setIsLoading(false);
          setIsFetching(false);
        }
      };

      const onScroll = () => {
        if (scrollContainerRef.current) {
          const { scrollTop, scrollHeight, clientHeight } = scrollContainerRef.current;
          if (scrollTop + clientHeight === scrollHeight) {
            fetchData();
          }
        }
      };

      // Fetch initial page of frames
      React.useEffect(() => {
        fetchData();
      }, []);

      // Subscribe to newer frames as they are captured
      React.useEffect(() => {
        if (isLoading) {
          return;
        }

        const backoffMs = 500 * frameStreamRetryCounter;
        console.log(`Connecting to SSE in ${backoffMs}ms`);
        const timeout = setTimeout(
          () => {
            frameStreamEventSourceRef.current = new EventSource(`api/frames/latest?after=${endCursor}`);

            frameStreamEventSourceRef.current.onopen = () => {
              console.log('SSE connection opened.');
            };

            frameStreamEventSourceRef.current.onmessage = (event) => {
              console.debug('Received message:', event.data);

              const newFrameEdge = JSON.parse(event.data);
              const newFrame = newFrameEdge.node;
              if (newFrame) {
                setEndCursor(newFrameEdge.cursor);
                setFrames(frames => {
                  const newFrames = [newFrame, ...frames];
                  newFrames.sort((a, b) => b.timestamp - a.timestamp);
                  const unique = newFrames.filter((x, i, a) => !i || x.name != a[i - 1].name)
                  return unique;
                });
              }
            };

            frameStreamEventSourceRef.current.onerror = (error) => {
              console.error('SSE error:', error);
              setFrameStreamRetryCounter(count => count + 1);
              frameStreamEventSourceRef.current.close();
              frameStreamEventSourceRef.current = null;
            };
          },
          backoffMs
        );

        return () => {
          clearTimeout(timeout);
          if (frameStreamEventSourceRef.current) {
            frameStreamEventSourceRef.current.close();
            frameStreamEventSourceRef.current = null;
          }
        };
      }, [isLoading, frameStreamRetryCounter]);

      // Fetch older frames on scroll down
      React.useEffect(() => {
        const current = scrollContainerRef.current;
        current?.addEventListener('scroll', onScroll);

        return () => {
          current?.removeEventListener('scroll', onScroll);
        };
      }, [scrollContainerRef.current, isFetching, startCursor, hasPreviousPage, frames]);

      if (isLoading) {
        return html`<p>Loading...</p>`;
      } else if (error) {
        return html`<p>Error</p>`;
      } else {
        return html`<ul className="frame_list">
            ${frames.map(frame => html`<${FrameListItem} frame=${frame} key=${frame.name} />`)}
            ${isFetching && html`<li key="loading">Loading...</li>`}
            ${!hasPreviousPage && html`<li key="end">No more frames</li>`}
            ${hasPreviousPage && html`
              <li key="more">
                  <p>
                    <button onClick=${fetchData}>Fetch more</button>
                  </p>
                </li>
              `}
          </ul>`;
      }
    };
    FrameList.propTypes = {
      scrollContainerRef: PropTypes.object.isRequired,
    };

    const App = (props) => {
      const scrollContainerRef = React.useRef();

      return html`<div ref=${scrollContainerRef} style=${{ "height": "100%", "overflow": "auto" }}>
          <${FrameList} key="frame_list" scrollContainerRef=${scrollContainerRef} />
        </div>`;
    }
    App.propTypes = {
    };

    const props = {
    };

    ReactDOM.render(
      html`<${App} ...${props}/>`,
      document.getElementById("root")
    );
  </script>
</body>

</html>
