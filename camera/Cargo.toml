[package]
name = "porch-camera"
version = "0.1.0"
edition = "2024"

[dependencies]
async-stream = "0.3.6"
axum = { version = "0.8.4", features = ["macros"] }
chrono = "0.4.42"
clap = { version = "4.5.48", features = ["derive"] }
cron = "0.15.0"
futures = "0.3.31"
http = "0.2.4"
multipart-stream = "0.1.2"
serde = {version = "1.0.228", features = ["derive"] }
tokio = { version = "1.47.1", features = [ "fs", "macros", "rt", "rt-multi-thread", "sync", "time" ] }
tower-http = { version="0.6.6", features = ["fs"] }
turbojpeg = { version ="1.3.3", default-features = false, features = [ "cmake", "require-simd" ] }
uvc = { path = "vendor/uvc", features = [ "vendor" ] }
