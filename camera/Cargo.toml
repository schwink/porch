[package]
name = "porch-camera"
version = "0.1.0"
edition = "2024"

[dependencies]
async-stream = "0.3.6"
axum = { version = "0.8.4", features = ["macros"] }
chrono = "0.4.42"
chrono-tz = "0.10.4"
clap = { version = "4.5.48", features = ["derive"] }
cron = "0.15.0"
futures = "0.3.31"
hamming = "0.1.3"
http = "0.2.4"
log = "0.4.28"
multipart-stream = "0.1.2"
opencv = { version = "0.96.0", default-features = false, features = [ "clang-runtime", "img_hash", "imgcodecs", "imgproc" ] }
ort = "=2.0.0-rc.10"
serde = {version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
simplelog = "0.12.2"
tch = "0.19.0"
tokio = { version = "1.47.1", features = [ "fs", "macros", "rt", "rt-multi-thread", "sync", "time" ] }
tower-http = { version="0.6.6", features = ["fs"] }
tracing = "0.1.41"
tracing-chrome = "0.7.2"
tracing-subscriber = "0.3.20"
uvc = { path = "vendor/uvc", features = [ "vendor" ] }

[dev-dependencies]
tempfile = "3.23.0"
tokio-test = "0.4.4"
